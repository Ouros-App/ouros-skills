name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md

  sonarcloud:
    # Compatibility context required by branch protection.
    # This repository is documentation-first; this job intentionally does not run a SonarCloud scan.
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compatibility context
        run: python scripts/validate_skills.py
      - name: Explain compatibility check
        run: echo "Branch protection currently requires the sonarcloud context; no SonarCloud analysis is performed in this job."

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,actions
      - name: Analyze
        uses: github/codeql-action/analyze@v3
